<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMOZAG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@800&display=swap');
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#070b16;color:#e8eeff}
header{padding:14px;text-align:center;background:#0e1931}
.tabs{display:flex;gap:6px;justify-content:center;padding:10px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;background:#16244a;border:1px solid #2a3d6e;cursor:pointer;font-size:13px}
.tab.active{background:#3b82f6;color:white}
.panel{background:#101c38;border:1px solid #2a3d6e;border-radius:14px;padding:12px;margin:10px}
textarea{width:100%;height:300px;background:#060a14;color:#cbd5e1;border:1px solid #2a3d6e;border-radius:10px;padding:10px;direction:ltr;text-align:left;font-family:monospace}
iframe{width:100%;height:300px;background:white;border-radius:10px;border:none}
.btn{padding:10px 20px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.run{background:#3b82f6;color:white}
</style>
</head>
<body>
<header>
<h2 style="margin:0;color:#5a8bff">ALMOZAG CRASH AL-MOZ3EG CODE</h2>
<p style="margin:4px 0 0;font-size:11px;color:#8aa0c5">المنصة الرسمية - اكواد + ذكاء اصطناعي + هاكر اخلاقي</p>
</header>

<div class="tabs">
<div class="tab active" id="t1" onclick="showTab('editor','t1')">محرر الاكواد</div>
<div class="tab" id="t2" onclick="showTab('ai','t2')">ALMOZAG AI</div>
<div class="tab" id="t3" onclick="showTab('hack','t3')">هاكر اخلاقي</div>
</div>

<div id="editor">
<div class="panel">
<textarea id="code"><h1 style="text-align:center;color:#3b82f6">Welcome POP!</h1>
<p style="text-align:center">ALMOZAG Platform Working!</p>
<button onclick="alert('ALMOZAG LEGEND')" style="display:block;margin:20px auto;padding:12px 25px;background:#3b82f6;color:white;border:none;border-radius:10px">Click Me</button>
</textarea>
<br><br>
<button class="btn run" onclick="run()">▶ تشغيل</button>
</div>
<div class="panel"><iframe id="out"></iframe></div>
</div>

<div id="ai" style="display:none">
<div class="panel">
<div id="chat" style="height:300px;overflow-y:auto;background:#060a14;padding:10px;border-radius:10px">أهلا يا بوب! انا ALMOZAG AI جاهز!</div>
<br>
<input id="q" placeholder="اسألني..." style="width:70%;padding:10px;border-radius:10px;border:1px solid #2a3d6e;background:#060a14;color:white">
<button class="btn run" onclick="ask()">ارسال</button>
</div>
</div>

<div id="hack" style="display:none">
<div class="panel" style="text-align:center">
<h3>عنوانك على النت IP</h3>
<h2 id="ip">...جاري التحميل</h2>
<button class="btn run" onclick="getIp()">تحديث</button>
<br><br>
<p style="font-size:12px">XSS - SQL Injection - Nmap - Wireshark</p>
<p style="font-size:11px;color:#ff6b6b">للتعليم فقط على موقعك انت - ممنوع تجرب على مواقع الغير</p>
</div>
</div>

<script>
function showTab(id,tid){
document.getElementById('editor').style.display='none';
document.getElementById('ai').style.display='none';
document.getElementById('hack').style.display='none';
document.getElementById(id).style.display='block';
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(tid).classList.add('active');
if(id==='editor') run();
if(id==='hack') getIp();
}
function run(){document.getElementById('out').srcdoc=document.getElementById('code').value}
function ask(){
let v=document.getElementById('q').value;
if(!v) return;
let c=document.getElementById('chat');
c.innerHTML+='<div style="text-align:right;margin:8px 0"><span style="background:#1e3a8a;padding:8px 12px;border-radius:12px;display:inline-block">'+v+'</span></div>';
document.getElementById('q').value='';
setTimeout(()=>{c.innerHTML+='<div style="margin:8px 0"><span style="background:#1a2746;padding:8px 12px;border-radius:12px;display:inline-block">فكرة جامدة! خد الكود ده وحطه في المحرر:<br>&lt;h1&gt;'+v+'&lt;/h1&gt;</span></div>';c.scrollTop=c.scrollHeight},400);
}
async function getIp(){
try{
let r=await fetch('https://api.ipify.org?format=json');
let d=await r.json();
document.getElementById('ip').innerText=d.ip;
}catch{document.getElementById('ip').innerText='افتح النت';}
}
window.onload=run;
</script>
</body>
</html>
