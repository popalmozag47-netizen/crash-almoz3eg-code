<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Cairo',sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%, #0f2d5e 0%, #000 70%);z-index:-1}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.h{width:56px;height:56px;background:#111;border:1.5px solid #00aaff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px #00aaff88;font-size:24px;cursor:pointer;transition:.2s}
.h:hover{transform:scale(1.1);box-shadow:0 0 25px #00aaff}
.logo{text-align:center;margin-top:10px}
.logo .crown{font-size:85px;filter:drop-shadow(0 0 25px #00aaff);display:block}
.logo h1{font-family:'Orbitron';color:#00d9ff;text-shadow:0 0 20px #00aaff;letter-spacing:3px;font-size:30px;margin-top:5px}
.logo p{color:#777;font-size:12px;margin-top:4px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;max-width:520px;margin:20px auto 90px}
.card{background:linear-gradient(145deg,#0d0d0d,#13244a);border:1.5px solid #00aaff55;border-radius:20px;padding:20px 10px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px) scale(1.02);border-color:#00d9ff;box-shadow:0 0 30px #00aaffaa}
.ic{font-size:38px;display:block}
.tt{font-size:13px;font-weight:800;margin-top:8px;display:block}
.blue{color:#00d9ff}.green{color:#00ff9d}.red{color:#ff2d55}.yellow{color:#ffcc00}.purple{color:#a855f7}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:9999;padding:12px;backdrop-filter:blur(6px)}
.modal.on{display:flex;justify-content:center;align-items:flex-start;padding-top:20px;overflow:auto}
.box{width:100%;max-width:560px;background:#080f25;border:1.5px solid #00aaff;border-radius:22px;padding:22px;position:relative;box-shadow:0 0 50px #00aaff66;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.box h2{color:#00d9ff;font-family:'Orbitron';text-align:center;margin-bottom:16px;font-size:18px}
.cl{position:absolute;top:10px;left:10px;background:#ff2d55;border:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:900;cursor:pointer}
iframe{width:100%;height:70vh;border:none;border-radius:14px;background:#000}
.dev-card{background:#000;border:1px solid #00aaff44;border-radius:14px;padding:14px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;transition:.2s}
.dev-card:hover{border-color:#00d9ff;background:#00111f}
.dev-card span{font-weight:700;font-size:14px}
.dev-card a{color:#00d9ff;text-decoration:none;font-weight:800;background:#00aaff22;padding:7px 16px;border-radius:9px;border:1px solid #00aaff44;font-size:13px}
.res{margin-top:12px;padding:12px;background:#000;border-radius:11px;border:1px solid #00aaff33;white-space:pre-wrap;line-height:1.8;font-size:13px;color:#ccc}
.footer{text-align:center;padding:20px;color:#444;font-size:11px}
</style>
